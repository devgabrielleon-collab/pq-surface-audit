[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pq-surface-audit"
version = "0.1.0"
description = "External post-quantum readiness scanner for authorized HTTPS/TLS and SSH assets"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Gabriel Leon + ChatGPT"}
]
license = {text = "MIT"}
dependencies = [
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "typer>=0.12.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]
ssh = [
  "paramiko>=3.4.0"
]

[project.scripts]
pqaudit = "pq_surface_audit.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
